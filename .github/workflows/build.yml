name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Create keystore
        run: |
          keytool -genkey -v -keystore tododroid-release.keystore -alias tododroid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tododroid123 -keypass tododroid123 \
            -dname "CN=BLESS SCOTT, OU=TodoDroid, O=BLESS SCOTT, L=Malawi, ST=Malawi, C=MW"
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build release APK
        run: ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TodoDroid-Release
          path: app/build/outputs/apk/release/app-release.apk
